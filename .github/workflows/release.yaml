name: Build and Upload Release Asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Grants permission to create releases and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Clean build artifacts
        run: Remove-Item -Recurse -Force dist/* -ErrorAction SilentlyContinue

      - name: Install Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Download Neutralino Binaries & Client
        run: npx @neutralinojs/neu update

      - name: Build App
        run: npx @neutralinojs/neu build --clean

      - name: Compress Build Output to ZIP
        run: |
          Compress-Archive -Path "dist\EasyDPI\*" -DestinationPath "EasyDPI-win_x64.zip" -Force

      - name: Create Inno Setup Script
        run: |
          $issContent = @"
          [Setup]
          AppName=EasyDPI
          AppVersion=1.0.0
          DefaultDirName={autopf}\EasyDPI
          DefaultGroupName=EasyDPI
          UninstallDisplayIcon={app}\EasyDPI-win_x64.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=.
          OutputBaseFilename=EasyDPI-Setup

          [Files]
          Source: "dist\EasyDPI\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\EasyDPI"; Filename: "{app}\EasyDPI-win_x64.exe"
          Name: "{autodesktop}\EasyDPI"; Filename: "{app}\EasyDPI-win_x64.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Run]
          Filename: "{app}\EasyDPI-win_x64.exe"; Description: "{cm:LaunchProgram,EasyDPI}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path build_installer.iss -Value $issContent

      - name: Compile Installer with Inno Setup
        run: |
          iscc build_installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EasyDPI-win_x64.zip
            EasyDPI-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}